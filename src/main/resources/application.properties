spring.application.name=backend

# PostgreSQL - Utilisation de variables d'environnement
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:quiz_tech}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:moussa}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Serveur
server.port=8080

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# OpenRouter - Variable d'environnement
openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions